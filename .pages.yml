# Pages CMS configuration (https://pagescms.org/docs/configuration/)
#
# Editors sign in at https://app.pagescms.org with GitHub, pick this repo,
# and get a form-based UI for the files under /content plus image uploads
# into /public. Every save is a git commit, which triggers a redeploy.

media:
  input: public
  output: /
  categories: [image]

content:
  - name: home
    label: Homepage
    type: file
    path: content/home.json
    fields:
      - name: hero
        label: Hero (top banner)
        type: object
        fields:
          - name: headline
            label: Headline
            type: text
            description: Use a line break where the heading should wrap.
          - name: image
            label: Background photo
            type: image
          - name: primaryCta
            label: Primary button text
            type: string
          - name: secondaryCta
            label: Secondary button text
            type: string
          - name: statValue
            label: "Stat card: big number"
            type: string
          - name: statLabel
            label: "Stat card: label"
            type: string
          - name: statNote
            label: "Stat card: small print"
            type: string
          - name: ratingLine
            label: 5-star card text
            type: string
      - name: specCards
        label: Feature cards (under hero)
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: desc
            label: Description
            type: string
      - name: capabilities
        label: Platform capabilities (numbered list)
        type: string
        list: true
      - name: platformImage
        label: Platform dashboard image
        type: image
      - name: platformNote
        label: Platform small-print note
        type: string
      - name: howItWorksImage
        label: How It Works photo
        type: image
      - name: steps
        label: How It Works steps
        type: object
        list: true
        fields:
          - name: no
            label: Number (e.g. 01)
            type: string
          - name: title
            label: Title
            type: string
          - name: desc
            label: Description
            type: text

  - name: products
    label: Products
    type: file
    path: content/products.json
    fields:
      - name: products
        label: Products
        type: object
        list: true
        fields:
          - name: id
            label: ID (do not change — used by checkout links)
            type: string
          - name: name
            label: Name
            type: string
          - name: price
            label: Price (USD)
            type: number
          - name: originalPrice
            label: Original price (for strikethrough)
            type: number
          - name: badge
            label: Badge
            type: string
          - name: category
            label: Category
            type: string
          - name: tagline
            label: Tagline
            type: string
          - name: capacity
            label: Capacity
            type: string
          - name: battery
            label: Battery / cooling backup
            type: string
          - name: noise
            label: Noise
            type: string
          - name: payments
            label: Payments
            type: string
          - name: weight
            label: Weight / dimensions
            type: string
          - name: bestFor
            label: Best for
            type: string
          - name: description
            label: Description
            type: text
          - name: imgUrl
            label: Main image
            type: image
          - name: imgW
            label: Main image width (px)
            type: number
          - name: imgH
            label: Main image height (px)
            type: number
          - name: gallery
            label: Extra gallery views
            type: object
            list: true
            fields:
              - name: src
                label: Image
                type: image
              - name: w
                label: Width (px)
                type: number
              - name: h
                label: Height (px)
                type: number
              - name: label
                label: View name (e.g. Side profile)
                type: string
          - name: specs
            label: Spec bullet points
            type: string
            list: true

  - name: reviews
    label: Reviews
    type: file
    path: content/reviews.json
    fields:
      - name: reviews
        label: Reviews
        type: object
        list: true
        fields:
          - name: stars
            label: Stars (1-5)
            type: number
          - name: text
            label: Review text
            type: text
          - name: name
            label: Reviewer name
            type: string
          - name: location
            label: Location / role line
            type: string
          - name: product
            label: Product reviewed
            type: string

  - name: faq
    label: FAQ
    type: file
    path: content/faq.json
    fields:
      - name: items
        label: Questions
        type: object
        list: true
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    fields:
      - name: contactEmail
        label: Contact email
        type: string
